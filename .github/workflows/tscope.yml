name: tscope
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe token scope
        run: |
          echo "=== GITHUB_TOKEN identity / installation repos ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/installation/repositories | head -c 400; echo
          echo "=== probe ungranted org private canary tokentest-canary-1789116960 ==="
          curl -s -o /dev/null -w "canary repo GET: %{http_code}\n" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/s3rdz0-org/tokentest-canary-1789116960
          curl -s -w "\ncanary SECRET.txt: %{http_code}\n" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/s3rdz0-org/tokentest-canary-1789116960/contents/SECRET.txt | head -c 300
